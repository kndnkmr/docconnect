<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="b0rwKW8FWvhMuOECWwWxFDC8PNWVYceLxLi_PDAr0QA" />
    <meta name="description" content="ProMedicoz - India's doctor consultation platform. Find qualified doctors, book appointments online, video consultations, and manage your health." />
    <meta name="keywords" content="doctor appointment, online consultation, book doctor, find doctor India, gynaecologist, neurologist, video consultation" />
    <!--
      viewport meta tag = makes the site responsive on mobile devices.
      Without it, mobile browsers zoom out and the site looks tiny.
    -->
    <title>ProMedicoz - Find & Book Doctors Online | India</title>

    <!-- Open Graph / social preview (Facebook, WhatsApp, LinkedIn).
         These live in the STATIC HTML on purpose: social scrapers usually do
         NOT run JavaScript, so the JS-injected tags from SEO.jsx aren't seen
         by them — the ones here are what a shared link actually shows.
         og:image should be a 1200x630 landscape image at /og-image.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProMedicoz" />
    <meta property="og:title" content="ProMedicoz - Consult Verified Doctors Online" />
    <meta property="og:description" content="Find and book verified doctors across India — video, phone, or in-person. Book in under 2 minutes. Your health, our priority." />
    <meta property="og:url" content="https://www.promedicoz.in/" />
    <meta property="og:image" content="https://www.promedicoz.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ProMedicoz - Consult verified doctors online" />

    <!-- Twitter / X large image card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ProMedicoz - Consult Verified Doctors Online" />
    <meta name="twitter:description" content="Find and book verified doctors across India — video, phone, or in-person. Book in under 2 minutes." />
    <meta name="twitter:image" content="https://www.promedicoz.in/og-image.png" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-28BZZQPPXF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-28BZZQPPXF');
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ProMedicoz" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <meta name="msapplication-TileColor" content="#2563eb" />
  </head>
  <body>
    <!--
      This is the ONLY HTML file in a React app (Single Page Application).
      React takes over the <div id="root"> and renders everything inside it.
      The actual content comes from JavaScript (React components).
      
      When you navigate between "pages", React just swaps what's inside this div.
      The browser never actually loads a new HTML page — that's why it's so fast!
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      type="module" = use ES modules (modern JavaScript imports)
      src="/src/main.jsx" = the JavaScript entry point
    -->
  </body>
</html>
