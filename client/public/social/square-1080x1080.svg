<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="180" r="240" fill="#ffffff" opacity="0.06"/>
  <circle cx="160" cy="940" r="200" fill="#ffffff" opacity="0.05"/>

  <!-- Brand: white rounded tile + medical cross, centered -->
  <g>
    <rect x="465" y="170" width="150" height="150" rx="36" fill="#ffffff"/>
    <rect x="527" y="200" width="26" height="90" rx="8" fill="#2563eb"/>
    <rect x="495" y="232" width="90" height="26" rx="8" fill="#2563eb"/>
  </g>
  <text x="540" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="bold" fill="#ffffff">ProMedicoz</text>

  <!-- Headline -->
  <text x="540" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#ffffff">Consult verified doctors online</text>
  <text x="540" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" fill="#dbeafe">Video • Phone • In-person, across India</text>

  <!-- CTA pill -->
  <rect x="290" y="740" width="500" height="110" rx="55" fill="#ffffff"/>
  <text x="540" y="812" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#2563eb">Book in 2 minutes</text>

  <!-- URL -->
  <text x="540" y="960" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#ffffff">www.promedicoz.in</text>
</svg>
