<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle decorative circles -->
  <circle cx="1050" cy="120" r="220" fill="#ffffff" opacity="0.06"/>
  <circle cx="120" cy="560" r="180" fill="#ffffff" opacity="0.05"/>

  <!-- Brand row: a white rounded square with a medical cross, then the name -->
  <g>
    <rect x="100" y="150" width="88" height="88" rx="20" fill="#ffffff"/>
    <!-- Medical cross (blue), centered in the square -->
    <rect x="136" y="166" width="16" height="56" rx="4" fill="#2563eb"/>
    <rect x="116" y="186" width="56" height="16" rx="4" fill="#2563eb"/>
  </g>
  <text x="212" y="228" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="bold" fill="#ffffff">ProMedicoz</text>

  <!-- Headline -->
  <text x="100" y="360" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#ffffff">Consult verified doctors online</text>
  <text x="100" y="425" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#dbeafe">Video, phone, or in-person — across India</text>

  <!-- Trust line / CTA -->
  <text x="100" y="520" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#ffffff">Book in under 2 minutes  •  www.promedicoz.in</text>
</svg>
